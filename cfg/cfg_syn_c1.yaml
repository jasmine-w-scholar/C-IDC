====== 数据集配置 ======
dataset: SEFS
#data_dir: synthetic_datasets
data_file: synthetic_datasets/correlate_data.npz  # SYN-C1 数据路径
#scaler: StandardScaler

# ====== 训练配置 ======
batch_size: 128 # SYN-C1 有 5000 样本，batch_size 可以适中
seeds: 3  # 运行 3 次不同随机种子
validate: true  # 开启验证

# ====== 训练轮数 ======
epochs: &epochs 500
ae_non_gated_epochs: 100  # 前 10 个 epoch 不启用门控
ae_pretrain_epochs: 300  # 前 100 个 epoch 预训练 Encoder-Decoder
start_global_gates_training_on_epoch: 450  # 从第 150 个 epoch 开始训练全局门控

# ====== E-IDC 集成门控配置 ======
n_learners: 5  # 集成中 learners 的数量（关键参数）
beta_s: 0.0001  # ComFS 组内稀疏损失权重（初始值）
beta_d: 0.01 # ComFS 组间差异损失权重（初始值）
beta_s_decay: 0.995  # beta_s 的衰减率（每个 epoch 乘以 0.99）
beta_d_decay: 0.995  # beta_d 的衰减率
comfs_lambda: 0.5 # ComFS 正则化的总权重 #comfs_lambda: 0.01
lambda_consistency: 0.1
# ✅ 新增：推理时是否启用动态淘汰（可选）
use_active_only_in_val: false  # 默认关闭，可设为 true 启用

correlation_lambda: 0.1
# ====== 数据增强 ======
mask_percentage: 0.9  # 随机 mask 90% 的特征
latent_noise_std: 0.01  # 隐藏层噪声标准差

# ====== PyTorch Lightning Trainer 配置 ======
trainer:
  devices: 1
  accelerator: gpu  # 如果没有 GPU，改为 cpu
  max_epochs: *epochs
  deterministic: true
  logger: true
  log_every_n_steps: 10
  check_val_every_n_epoch: 10  # 每 10 个 epoch 验证一次
  enable_checkpointing: false
  num_sanity_val_steps: 0

# ====== GTCR 损失（Total Coding Rate）======
gtcr_loss: true
#gtcr_projection_dim: 1024  #gtcr_projection_dim: 128
gtcr_projection_dim: null
gtcr_eps: 1
gtcr_lambda: 0.09  # GTCR 损失权重

# ====== MCRR 损失（Maximal Coding Rate Reduction）======
#eps: 0.1  # MCRR 的 epsilon #eps: 0.01
eps: 0.1
# ====== 门控网络配置 ======
use_gating: true
gates_hidden_dim: 1024  # 门控网络隐藏层维度（根据特征数调整）#512

# ====== Encoder-Decoder 架构 ======
encdec:
  - 512   # 第一层：500 → 256
  - 512   # 第二层
  - 2048   # 第三层
  - &bn_layer 128  # 瓶颈层（Bottleneck）：最小维度
  - 2048   # 解码器第一层
  - 512   # 解码器第二层
  - 512   # 解码器第三层：256 → 500

# ====== 聚类头 ======
clustering_head:
  - *bn_layer  # 输入：64（瓶颈层）
  - 2048        # 隐藏层

# ====== Gumbel-Softmax 温度 ======
#tau: 100 #tau: 5
tau: 60
# ====== 辅助分类器 ======
aux_classifier:
  - 2048

# ====== 损失权重 ======
local_gates_lambda: 8
global_gates_lambda: 0.5  # 全局门控正则化权重

# ====== 学习率配置 ======
lr:
  pretrain: 1e-4   # 预训练学习率
  clustering: 5e-4   # 聚类学习率
  aux_classifier: 5e-4 # 辅助分类器学习率

# ====== 学习率调度器 ======
sched:
  pretrain_min_lr: 1e-5    # 预训练最小学习率
  clustering_min_lr: 1e-6  # 聚类最小学习率

# ====== 保存检查点 ======
save_seed_checkpoints: false  # 保存最佳模型-*
