# ====== ALLAML 轻量改进版配置 ======
# 目标：ACC 77.5% → ≥82.5%
# 改动：仅 Dropout + SEFS退火 + K-Means + AdamW/MixUp，不改架构

# ====== 数据集配置 ======
dataset: ALLAML
data_file: dataset/ALLAML.npz
correlation_threshold: 0.075

# ====== 训练配置 ======
batch_size: 6
seeds: 10
validate: true

# ====== 训练轮数 ======
epochs: &epochs 1287
ae_non_gated_epochs: 58
ae_pretrain_epochs: 594
start_global_gates_training_on_epoch: 812

# ====== 数据增强 ======
mask_percentage: 0.63
latent_noise_std: 0.01

# ====== PyTorch Lightning Trainer 配置 ======
trainer:
  devices: 1
  accelerator: gpu
  max_epochs: *epochs
  deterministic: true
  logger: true
  log_every_n_steps: 10
  check_val_every_n_epoch: 10
  enable_checkpointing: false
  num_sanity_val_steps: 0

# ====== GTCR 损失 ======
gtcr_loss: true
gtcr_projection_dim: null
gtcr_eps: 1
gtcr_lambda: 0.033

# ====== MCRR 损失 ======
eps: 0.35

# ====== 门控网络配置 ======
use_gating: true
gates_hidden_dim: 120

# ====== D1：原有 Encoder-Decoder 架构 + Dropout ======
encdec_dropout: 0.2
encdec:
  - 512
  - 512
  - 2048
  - &bn_layer 32
  - 2048
  - 512
  - 512

# ====== 聚类头 ======
clustering_head:
  - *bn_layer
  - 128

# ====== Gumbel-Softmax 温度 ======
tau: 60

# ====== D3：SEFS 温度退火 ======
sefs_tau: 1.29
sefs_tau_start: 3.0
sefs_tau_end: 0.8
use_sefs_annealing: true

# ====== 辅助分类器 ======
aux_classifier:
  - 128

# ====== 损失权重 ======
local_gates_lambda: 1.21
global_gates_lambda: 0.0002
balance_loss_lambda: 0.1

# ====== 学习率配置 ======
lr:
  pretrain: 8e-4
  clustering: 4e-3
  aux_classifier: 1e-4

# ====== 学习率调度器 ======
sched:
  pretrain_min_lr: 2e-5
  clustering_min_lr: 5e-7

# ====== D2+D4：AdamW + Warmup + 梯度裁剪 ======
weight_decay_pretrain: 1e-4
weight_decay_cluster: 1e-5
warmup_ratio: 0.05
grad_clip_norm: 1.0

# ====== D5+D6：MixUp 增强 ======
mixup_alpha: 0.2

# ====== 改进开关汇总 ======
use_sefs: true
use_kmeans_init: true            # D5：K-Means 聚类头初始化

# ====== 保存检查点 ======
save_seed_checkpoints: false
